name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @lootden/desktop

  playnite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build playnite/GameManagerLibrary -c Release
